[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "eptfe"
version = "0.1.0"
description = "SEM microstructure -> suture retention strength for ePTFE: lot-aware evaluation, classical and neural models"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
